<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ハムハムトーク</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221A1C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハムハム">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root {
  --bg: #FFF6EE; --panel: #FFFFFF; --ink: #4A3228; --sub: #A58A7C; --line: #F1E1D6;
  --mine: #FF8FA3; --mine-ink: #FFFFFF; --theirs: #FFFFFF; --accent: #F0607C; --soft: #FFE3E8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #221A1C; --panel: #2E2427; --ink: #F6E9E4; --sub: #A8928F; --line: #3D3034;
    --mine: #E8718A; --mine-ink: #FFFFFF; --theirs: #3A2E32; --accent: #FF8FA3; --soft: #47323A;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "Zen Maru Gothic", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  font-size: 16px; line-height: 1.5; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
[hidden] { display: none !important; }

/* 入室まえの画面 */
#gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.card { width: min(360px, 100%); text-align: center; }
.card img { width: 112px; height: 112px; border-radius: 32px; }
.card h1 { font-size: 26px; margin: 16px 0 4px; letter-spacing: .04em; }
.card p { color: var(--sub); margin: 0 0 24px; }
.card input {
  width: 100%; font: inherit; font-size: 17px; text-align: center; color: var(--ink);
  padding: 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel); outline: none;
}
.card input:focus { border-color: var(--mine); }
.primary {
  width: 100%; margin-top: 12px; padding: 14px; border-radius: 16px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 17px;
}
.primary:disabled { opacity: .5; }
.card input + input { margin-top: 8px; }
.link { margin-top: 16px; color: var(--sub); text-decoration: underline; font-size: 14px; padding: 8px; }
.error { color: var(--accent); min-height: 1.5em; margin-top: 12px; font-size: 14px; }

/* チャット */
#app { position: fixed; top: 0; left: 0; right: 0; height: var(--vvh, 100dvh); transform: translateY(var(--vvt, 0px));
  display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
header {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--line); background: var(--bg);
}
header img { width: 40px; height: 40px; border-radius: 14px; }
header .who { flex: 1; min-width: 0; }
header .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .days { font-size: 12px; color: var(--sub); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; }
.icon-btn:active { background: var(--soft); }
#banner, .banner { background: var(--soft); padding: 12px 16px; font-size: 14px; display: flex; gap: 12px; align-items: center; }
#banner span, .banner span { flex: 1; }
.banner .x { background: none !important; color: var(--sub) !important; padding: 8px !important; }
#banner button, .banner button { background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; white-space: nowrap; }

#logwrap { position: relative; flex: 1; min-height: 0; display: flex; }
#log { flex: 1; min-width: 0; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 4px;
  overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
#down { position: absolute; right: 14px; bottom: 12px; width: 46px; height: 46px; border-radius: 50%; background: var(--panel);
  color: var(--accent); font-size: 22px; font-weight: 800; box-shadow: 0 2px 12px rgba(0,0,0,.28); }
#unread { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px;
  background: var(--accent); color: #fff; font-size: 12px; line-height: 20px; }
.day { align-self: center; font-size: 12px; color: var(--sub); background: var(--soft); border-radius: 999px; padding: 2px 12px; margin: 10px 0 6px; }
.row { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; }
.row.mine { flex-direction: row-reverse; }
.bubble {
  max-width: min(76%, 480px); padding: 9px 14px; border-radius: 20px; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--theirs); border-bottom-left-radius: 6px; box-shadow: 0 1px 0 var(--line);
}
.mine .bubble { background: var(--mine); color: var(--mine-ink); border-radius: 20px; border-bottom-right-radius: 6px; box-shadow: none; }
#stickers { max-height: 40vh; overflow-y: auto; }
#stickers button.pic { padding: 4px; }
#stickers button.pic img { display: block; width: 100%; height: 64px; object-fit: contain; }
.stk { display: block; width: min(42vw, 170px); height: auto; }
.sticker {
  text-align: center; padding: 10px 16px 8px; border-radius: 28px; background: var(--soft);
  border: 3px solid #fff; box-shadow: 0 2px 8px rgba(240, 96, 124, .25); transform: rotate(-2deg);
}
.mine .sticker { transform: rotate(2deg); }
.sticker .emo { font-size: 46px; line-height: 1.15; }
.sticker .cap { font-weight: 800; color: var(--accent); font-size: 15px; }
.meta { font-size: 11px; color: var(--sub); line-height: 1.3; text-align: right; flex-shrink: 0; }
.row:not(.mine) .meta { text-align: left; }
.pending { opacity: .55; }
.photo { display: block; width: min(72vw, 320px); height: auto; border-radius: 18px; background: var(--soft); cursor: zoom-in; }
.photo-box { border-radius: 18px; overflow: hidden; line-height: 0; }
#viewer { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.92); display: grid; place-items: center; }
#viewer img { max-width: 100vw; max-height: 100dvh; object-fit: contain; }
#viewer a { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 16px; color: #fff; font-size: 14px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.2); text-decoration: none; }
#empty { margin: auto; text-align: center; color: var(--sub); }

/* 入力まわり */
#stickers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
#stickers button { border-radius: 16px; padding: 6px 2px; background: var(--bg); }
#stickers button:active { background: var(--soft); }
#stickers .emo { font-size: 28px; line-height: 1.2; }
#stickers .cap { font-size: 11px; color: var(--sub); }
#composer {
  display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--panel);
}
#text {
  flex: 1; min-width: 0; resize: none; font: inherit; color: var(--ink); background: var(--bg);
  border: 0; outline: none; border-radius: 22px; padding: 10px 16px; max-height: 132px;
}
#hamu { height: 44px; padding: 0 12px; border-radius: 22px; font-weight: 800; font-size: 14px; color: var(--sub); border: 2px solid var(--line); }
#hamu[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
#send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 20px; flex-shrink: 0; }
#send:disabled { opacity: .4; }
#status { font-size: 12px; color: var(--sub); text-align: center; padding: 2px; }

/* メニュー */
dialog { border: 0; border-radius: 24px; padding: 20px; width: min(340px, calc(100% - 32px)); background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(40, 20, 24, .45); }
dialog h2 { font-size: 18px; margin: 0 0 12px; }
dialog .item { display: block; width: 100%; text-align: left; padding: 13px 14px; border-radius: 14px; background: var(--bg); margin-top: 8px; }
dialog .item small { display: block; color: var(--sub); font-size: 12px; }
dialog label { display: block; margin-top: 14px; font-size: 14px; color: var(--sub); }
dialog input[type=date] { width: 100%; font: inherit; color: var(--ink); padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); margin-top: 4px; }
dialog .close { margin-top: 16px; width: 100%; padding: 12px; border-radius: 14px; background: var(--soft); font-weight: 700; }
#toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%;
}
#toast.show { opacity: .95; }
</style>
</head>
<body>

<main id="gate" hidden>
  <div class="card">
    <img src="/icon.svg" alt="">
    <h1>ハムハムトーク</h1>
    <p id="gate-lead">ふたりだけのおへやはむ</p>
    <form id="auth" hidden>
      <input id="name" maxlength="20" placeholder="なまえ" autocomplete="username" autocapitalize="off" required>
      <input id="password" type="password" minlength="6" maxlength="100" placeholder="パスワード（6文字以上）" autocomplete="current-password" required>
      <button class="primary" id="auth-btn">ログイン</button>
      <button type="button" class="link" id="switch" hidden></button>
    </form>
    <div class="error" id="gate-error"></div>
  </div>
</main>

<div id="app" hidden>
  <header>
    <img src="/icon.svg" alt="">
    <div class="who">
      <div class="name" id="partner">ハムハムトーク</div>
      <div class="days" id="days"></div>
    </div>
    <button class="icon-btn" id="menu-btn" aria-label="メニュー">☰</button>
  </header>
  <div id="banner" hidden><span>まだひとりはむ。招待リンクを送って、あの人を呼ぶはむ🐹</span><button id="invite-btn">リンクをコピー</button></div>
  <div id="notify-banner" class="banner" hidden><span id="notify-text"></span><button id="notify-on">オンにする</button><button id="notify-x" class="x" aria-label="とじる">✕</button></div>
  <div id="logwrap">
    <div id="log" aria-live="polite"></div>
    <button id="down" type="button" hidden aria-label="いちばん下へ">↓<span id="unread" hidden></span></button>
  </div>
  <div id="status" hidden>つなぎなおしてるはむ…</div>
  <div id="stickers" hidden></div>
  <form id="composer">
    <button type="button" class="icon-btn" id="photo-btn" aria-label="写真">📷</button>
    <input type="file" id="photo" accept="image/*" hidden>
    <button type="button" class="icon-btn" id="sticker-btn" aria-label="スタンプ">🐹</button>
    <textarea id="text" rows="1" placeholder="メッセージ" enterkeyhint="send"></textarea>
    <button type="button" id="hamu" aria-pressed="false" title="文末に自動で「はむ」をつける">はむ</button>
    <button id="send" aria-label="送信" disabled>➤</button>
  </form>
</div>

<dialog id="menu">
  <h2>せってい</h2>
  <button class="item" id="notify-btn">🔔 通知をオンにする<small>お試し通知が1通とどくはむ。iPhone はホーム画面アプリから</small></button>
  <button class="item" id="pass-btn">🔑 パスワードを変える<small>ほかの端末はログアウトされるはむ</small></button>
  <button class="item" id="logout-btn">🚪 ログアウト<small>べつの端末では、なまえとパスワードでログインできるはむ</small></button>
  <label>💕 付き合った日<input type="date" id="anniv"></label>
  <button class="close" id="menu-close">とじる</button>
</dialog>
<div id="viewer" hidden><a id="viewer-close" href="#">✕ とじる</a><img alt=""></div>
<div id="toast"></div>

<script type="module">
import { toHamu, daysTogether } from "/hamu.js";

const $ = (id) => document.getElementById(id);
const IMG_STICKERS = ["daisuki", "bunny", "surprised", "bunnyback", "bee", "hug", "sleep", "sushi", "sandwich", "onigiri", "doctor", "bus"];
const stickerSrc = (name) => `/stickers/${name}.webp?token=${encodeURIComponent(token)}`;
const STICKERS = [
  ["🐹💕", "大好きはむ"], ["🥰", "しあわせはむ"], ["🫶", "ぎゅーはむ"], ["😘", "ちゅっはむ"],
  ["🥺", "会いたいはむ"], ["🙏✨", "ありがとはむ"], ["💮", "えらいはむ"], ["😳", "てれるはむ"],
  ["☀️", "おはようはむ"], ["🌙", "おやすみはむ"], ["🍵", "おつかれはむ"], ["🌻", "がんばれはむ"],
];

// ---- 端末に保存するもの ----
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
// リンクの #login= / ?login=（ホーム画面アプリの起動 URL）から鍵を受け取る
const readLink = (url) => {
  try { const u = new URL(url, location.origin); return new URLSearchParams(u.hash.slice(1) || u.search); }
  catch { return new URLSearchParams(); }
};
const hash = readLink(location.href);
if (hash.get("login")) store.set("token", hash.get("login"));
const inviteCode = hash.get("invite");
if (location.hash || location.search) history.replaceState(null, "", location.pathname);

let token = store.get("token");
let state = null, ws = null, meId = null, partnerRead = 0, retry = 0, anniversary = null;
const messages = new Map();   // id -> message
const pending = new Map();    // cid -> 送信中のメッセージ
let hamuMode = store.get("hamu") === "1";

function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200);
}
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch { prompt("コピーしてね", text); }
}
const api = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) } })
    .then(async (r) => ({ ok: r.ok, ...(await r.json()) }));

// ---- 入室 ----
let mode = "login"; // login: ログイン / join: はじめての登録 / setpass: 旧メンバーのパスワード設定
function setMode(next) {
  mode = next;
  const canJoin = state.members === 0 || (state.members === 1 && !!inviteCode);
  const canLogin = state.members >= 1;
  $("gate-lead").textContent = {
    login: "ふたりだけのおへやはむ🔒 ログインしてね",
    join: state.members === 0 ? "ふたりだけのおへやを作るはむ" : "あの人がまってるはむ💕 登録してね",
    setpass: `${state.me?.name} のパスワードを決めるはむ。これで別の端末からも入れるはむ`,
  }[mode];
  $("auth-btn").textContent = { login: "ログイン", join: "登録しておへやに入る", setpass: "パスワードを決める" }[mode];
  $("name").hidden = mode === "setpass"; $("name").required = mode !== "setpass";
  $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("switch").hidden = mode === "setpass" || !(canJoin && canLogin);
  $("switch").textContent = mode === "join" ? "もう登録してる人はログイン" : "はじめての人は登録";
  $("gate-error").textContent = "";
  $("auth").hidden = false;
}
async function boot() {
  state = await api("/api/state");
  if (state.me && !state.me.needsPassword) return startChat();
  $("gate").hidden = false;
  if (state.me) setMode("setpass");
  else if (state.members === 0 || (state.members === 1 && inviteCode)) setMode("join");
  else setMode("login");
}
$("switch").addEventListener("click", () => setMode(mode === "join" ? "login" : "join"));
$("auth").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("auth-btn").disabled = true; $("gate-error").textContent = "";
  const path = { join: "/api/join", login: "/api/login", setpass: "/api/password" }[mode];
  const res = await api(path, { method: "POST", body: JSON.stringify({ name: $("name").value, password: $("password").value, invite: inviteCode }) })
    .catch(() => ({ error: "つながらなかったはむ…" }));
  $("auth-btn").disabled = false;
  if (!res.ok) { $("gate-error").textContent = res.error; return; }
  if (res.token) { token = res.token; store.set("token", token); }
  state = await api("/api/state");
  startChat();
});

// ---- チャット ----
function startChat() {
  $("gate").hidden = true; $("app").hidden = false;
  setPartner(state.partner);
  $("hamu").setAttribute("aria-pressed", hamuMode);
  for (const name of IMG_STICKERS) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pic"; b.setAttribute("aria-label", "スタンプ");
    const im = document.createElement("img"); im.src = stickerSrc(name); im.alt = ""; im.loading = "lazy";
    b.append(im);
    b.addEventListener("click", () => { send("sticker", `img:${name}`); $("stickers").hidden = true; });
    $("stickers").append(b);
  }
  for (const [emo, cap] of STICKERS) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<div class="emo"></div><div class="cap"></div>`;
    b.children[0].textContent = emo; b.children[1].textContent = cap;
    b.addEventListener("click", () => { send("sticker", `${emo}|${cap}`); $("stickers").hidden = true; });
    $("stickers").append(b);
  }
  connect();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js")
      // すでに許可ずみの端末は、ログインしなおしても自動で通知先に登録しなおす
      .then(() => { if (window.Notification?.permission === "granted" && "PushManager" in window) return subscribePush(false); })
      .catch(() => {});
  }
  showNotifyBanner();
}
function setPartner(name) {
  $("partner").textContent = name ? `${name} 💕` : "ハムハムトーク";
  $("banner").hidden = !!name;
}
function showDays() {
  const d = daysTogether(anniversary);
  $("days").textContent = d ? `ふたりで ${d}日目はむ` : "";
  $("anniv").value = anniversary ?? "";
}

function connect() {
  ws = new WebSocket(`${location.origin.replace(/^http/, "ws")}/api/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { retry = 0; $("status").hidden = true; sendVisibility(); for (const p of pending.values()) if (p.wire) ws.send(JSON.stringify(p.wire)); };
  ws.onmessage = (e) => { if (e.data !== "pong") handle(JSON.parse(e.data)); };
  ws.onclose = async () => {
    $("status").hidden = false;
    // ログアウトされていたら（パスワード変更など）ログイン画面にもどる
    if (retry >= 2 && (await api("/api/state").catch(() => null))?.me === null) { store.set("token", ""); return location.reload(); }
    setTimeout(connect, Math.min(1000 * 2 ** retry++, 15000));
  };
}
// 画面を見ているあいだだけ生存確認を送る（止まるとサーバーは「見ていない」と判断して通知を出す）
setInterval(() => { if (ws?.readyState === 1 && document.visibilityState === "visible") ws.send("ping"); }, 10000);

function handle(d) {
  if (d.t === "init") {
    meId = d.me; partnerRead = d.partnerRead; anniversary = d.anniversary;
    const first = !handle.started; handle.started = true;
    messages.clear();
    for (const m of d.messages) messages.set(m.id, m);
    // つなぎなおしたときに、読んでいる位置が飛ばないようにする（最初の 1 回だけ下まで）
    setPartner(d.partner); showDays(); render(first || nearBottom()); markRead();
  } else if (d.t === "msg") {
    messages.set(d.m.id, d.m);
    if (d.cid) { adopt(d.cid, d.m.id); pending.delete(d.cid); }
    const mine = d.m.sender === meId, stick = mine || nearBottom();
    if (!mine && !stick) unread++;
    render(stick); markRead();
    if (!mine) { try { navigator.vibrate?.(80); } catch {} } // 開いているときも軽くブルッ（Android）
  } else if (d.t === "read") {
    if (d.by !== meId) { partnerRead = Math.max(partnerRead, d.id); render(false); }
  } else if (d.t === "partner") {
    setPartner(d.name); toast(`${d.name} がおへやに来たはむ🐹💕`);
  } else if (d.t === "anniv") {
    anniversary = d.date || null; showDays();
  }
}

const log = $("log");
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 120;
const fmtTime = (ts) => new Date(ts).toLocaleTimeString("ja-JP", { hour: "numeric", minute: "2-digit" });
const fmtDay = (ts) => new Date(ts).toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
const STK_SIZE = { daisuki: [580, 456], bunny: [580, 542], surprised: [578, 538], bunnyback: [580, 498], bee: [550, 578], hug: [580, 450],
  sleep: [580, 442], sushi: [536, 582], sandwich: [580, 572], onigiri: [528, 578], doctor: [576, 458], bus: [580, 566] };

const nodes = new Map(); // 表示ずみの行（キー → 要素）。作り直さず使い回して、スクロール位置を守る
let emptyEl = null, unread = 0;

function buildRow(m) {
  const row = document.createElement("div"); row.className = "row";
  let body;
  if (m.kind === "image") {
    const [id, w, h] = m.body.split("|");
    body = document.createElement("div"); body.className = "photo-box";
    const im = document.createElement("img"); im.className = "photo"; im.alt = "写真"; im.loading = "lazy";
    im.src = m.preview ?? `/api/img/${id}?token=${encodeURIComponent(token)}`;
    if (w && h) im.style.aspectRatio = `${w} / ${h}`; // 読みこみ前から高さが決まるので、スクロール中にずれない
    im.addEventListener("click", () => openViewer(im.src));
    body.append(im);
  } else if (m.kind === "sticker" && /^img:[a-z]{2,16}$/.test(m.body)) {
    const name = m.body.slice(4);
    body = document.createElement("img"); body.className = "stk"; body.alt = "スタンプ"; body.src = stickerSrc(name);
    if (STK_SIZE[name]) body.style.aspectRatio = STK_SIZE[name].join(" / ");
  } else if (m.kind === "sticker") {
    const [emo, cap = ""] = m.body.split("|");
    body = document.createElement("div"); body.className = "sticker";
    const e = document.createElement("div"); e.className = "emo"; e.textContent = emo;
    const c = document.createElement("div"); c.className = "cap"; c.textContent = cap;
    body.append(e, c);
  } else {
    body = document.createElement("div"); body.className = "bubble"; body.textContent = m.body;
  }
  const meta = document.createElement("div"); meta.className = "meta";
  row.append(body, meta);
  return row;
}
function updateRow(row, m) {
  row.classList.toggle("mine", m.sender === meId);
  row.classList.toggle("pending", !m.id);
  const text = (m.sender === meId && m.id && m.id <= partnerRead ? "既読<br>" : "") + (m.id ? fmtTime(m.ts) : "送信中");
  const meta = row.lastChild;
  if (meta._t !== text) { meta.innerHTML = text; meta._t = text; }
}
/** 送信中の行を、サーバーから届いた本物のメッセージの行として引き継ぐ（ちらつき防止） */
function adopt(cid, id) {
  if (nodes.has("p" + cid)) { nodes.set("m" + id, nodes.get("p" + cid)); nodes.delete("p" + cid); }
}

function render(stick) {
  const all = [...messages.values(), ...[...pending.entries()].map(([cid, p]) => ({ ...p.local, cid }))];
  if (!all.length) {
    nodes.clear();
    if (!emptyEl) { emptyEl = document.createElement("div"); emptyEl.id = "empty"; emptyEl.innerHTML = "さいしょのひとことを<br>送ってみるはむ🐹💕"; }
    log.replaceChildren(emptyEl);
    return;
  }
  if (emptyEl?.parentNode) emptyEl.remove();
  const seen = new Set();
  let cursor = log.firstChild, lastDay = "";
  const place = (key, make, m) => {
    let el = nodes.get(key);
    if (!el) { el = make(); nodes.set(key, el); }
    if (m) updateRow(el, m);
    seen.add(key);
    if (el === cursor) cursor = cursor.nextSibling; else log.insertBefore(el, cursor);
  };
  for (const m of all) {
    const day = fmtDay(m.ts);
    if (day !== lastDay) {
      place("d" + day, () => { const d = document.createElement("div"); d.className = "day"; d.textContent = day; return d; });
      lastDay = day;
    }
    place(m.id ? "m" + m.id : "p" + m.cid, () => buildRow(m), m);
  }
  while (cursor) { const next = cursor.nextSibling; cursor.remove(); cursor = next; }
  for (const k of nodes.keys()) if (!seen.has(k)) nodes.delete(k);
  if (stick) { log.scrollTop = log.scrollHeight; pinned = true; }
  updateDown();
}

/** 上を読んでいるときだけ「↓」ボタンを出す。読んでいるあいだに届いた数も表示 */
function updateDown() {
  const away = !nearBottom();
  if (!away) unread = 0;
  $("down").hidden = !away;
  $("unread").hidden = !unread; $("unread").textContent = unread ? (unread > 99 ? "99+" : String(unread)) : "";
}
// 「いちばん下を見ている」あいだは、キーボードや入力欄の高さが変わっても下に付いたままにする
let pinned = true;
log.addEventListener("scroll", () => { pinned = nearBottom(); updateDown(); }, { passive: true });
new ResizeObserver(() => { if (pinned) { log.scrollTop = log.scrollHeight; updateDown(); } }).observe(log);
const vv = window.visualViewport;
function fitViewport() {
  if (!vv) return;
  const root = document.documentElement.style;
  root.setProperty("--vvh", `${vv.height}px`);
  root.setProperty("--vvt", `${vv.offsetTop}px`);
  if (window.scrollY) window.scrollTo(0, 0);
}
vv?.addEventListener("resize", fitViewport); vv?.addEventListener("scroll", fitViewport);
fitViewport();
$("down").addEventListener("click", () => log.scrollTo({ top: log.scrollHeight, behavior: "smooth" }));
log.addEventListener("pointerdown", () => { $("stickers").hidden = true; }, { passive: true });

function markRead() {
  if (document.visibilityState !== "visible" || ws?.readyState !== 1) return;
  let last = 0;
  for (const m of messages.values()) if (m.sender !== meId) last = Math.max(last, m.id);
  if (last > (markRead.sent ?? 0)) { ws.send(JSON.stringify({ t: "read", id: last })); markRead.sent = last; }
}
function sendVisibility() {
  if (ws?.readyState === 1) ws.send(JSON.stringify({ t: "vis", v: document.visibilityState === "visible" }));
}
document.addEventListener("visibilitychange", () => { sendVisibility(); markRead(); });

function send(kind, body) {
  const cid = crypto.randomUUID();
  const wire = { t: "msg", kind, body, cid };
  pending.set(cid, { wire, local: { sender: meId, kind, body, ts: Date.now() } });
  if (ws?.readyState === 1) ws.send(JSON.stringify(wire));
  render(true);
}

// ---- 入力 ----
const text = $("text");
function fit() { text.style.height = "auto"; text.style.height = text.scrollHeight + "px"; $("send").disabled = !text.value.trim(); }
text.addEventListener("input", fit);
text.addEventListener("keydown", (e) => {
  // パソコンは Enter で送信、スマホは改行（送信はボタン）
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const value = text.value.trim();
  if (!value) return;
  send("text", hamuMode ? toHamu(value) : value);
  text.value = ""; fit(); text.focus();
});
$("send").addEventListener("mousedown", (e) => e.preventDefault());
$("hamu").addEventListener("mousedown", (e) => e.preventDefault());
$("hamu").addEventListener("click", () => {
  hamuMode = !hamuMode; store.set("hamu", hamuMode ? "1" : "0");
  $("hamu").setAttribute("aria-pressed", hamuMode);
  toast(hamuMode ? "はむモード ON：文末に「はむ」がつくはむ" : "はむモード OFF");
});
// ---- 写真 ----
const MAX_SIDE = 1280;
async function toJpeg(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.82));
  return { blob, w, h };
}
async function sendPhoto(file) {
  const cid = crypto.randomUUID();
  let preview;
  try {
    const { blob, w, h } = await toJpeg(file);
    preview = URL.createObjectURL(blob);
    // 送信中は手元のプレビューを薄く表示
    pending.set(cid, { wire: null, local: { sender: meId, kind: "image", body: `x|${w}|${h}`, preview, ts: Date.now() } });
    render(true);
    const res = await fetch("/api/upload", { method: "POST", body: blob, headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const wire = { t: "msg", kind: "image", body: `${data.id}|${w}|${h}`, cid };
    pending.get(cid).wire = wire;
    if (ws?.readyState === 1) ws.send(JSON.stringify(wire));
    else throw new Error("つながってないはむ。もういちど送ってね");
  } catch (err) {
    pending.delete(cid); render(false);
    toast(err.message?.includes("はむ") ? err.message : "写真を送れなかったはむ…");
  }
}
$("photo-btn").addEventListener("click", () => $("photo").click());
$("photo").addEventListener("change", async (e) => {
  for (const f of e.target.files) await sendPhoto(f);
  e.target.value = "";
});
function openViewer(src) { $("viewer").querySelector("img").src = src; $("viewer").hidden = false; }
$("viewer").addEventListener("click", (e) => { if (e.target.id !== "viewer-close" || e.preventDefault() === undefined) $("viewer").hidden = true; });

$("sticker-btn").addEventListener("click", () => {
  const atBottom = nearBottom();
  $("stickers").hidden = !$("stickers").hidden;
  if (atBottom) requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
});
text.addEventListener("focus", () => { $("stickers").hidden = true; });

// ---- メニュー ----
$("menu-btn").addEventListener("click", () => $("menu").showModal());
$("menu-close").addEventListener("click", () => $("menu").close());
$("invite-btn").addEventListener("click", () => copy(`${location.origin}/#invite=${state.invite}`, "招待リンクをコピーしたはむ！あの人に送ってね"));
$("pass-btn").addEventListener("click", async () => {
  const password = prompt("新しいパスワード（6文字以上）");
  if (!password) return;
  const res = await api("/api/password", { method: "POST", body: JSON.stringify({ password }) });
  toast(res.ok ? "パスワードを変えたはむ🔑" : res.error);
});
$("logout-btn").addEventListener("click", async () => {
  if (!confirm("ログアウトするはむ？")) return;
  try { await (await (await navigator.serviceWorker?.getRegistration())?.pushManager.getSubscription())?.unsubscribe(); } catch {}
  await api("/api/logout", { method: "POST" }).catch(() => {});
  store.set("token", "");
  location.reload();
});
$("anniv").addEventListener("change", (e) => ws?.readyState === 1 && ws.send(JSON.stringify({ t: "anniv", date: e.target.value })));
const inApp = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/** この端末を通知先として登録する。test=true ならお試し通知も送る */
async function subscribePush(test) {
  const reg = await navigator.serviceWorker.ready;
  const key = Uint8Array.from(atob(state.vapidKey.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const sub = (await reg.pushManager.getSubscription()) ?? (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
  const res = await api("/api/push", { method: "POST", body: JSON.stringify({ endpoint: sub.endpoint, test }) });
  if (!res.ok) throw new Error("登録に失敗したはむ");
  if (test && res.test !== "ok") throw new Error(`お試し通知が送れなかったはむ（${res.test}）`);
}
async function enableNotifications() {
  try {
    if (!("PushManager" in window) || !("Notification" in window)) {
      throw new Error(isIOS && !inApp ? "iPhone は共有ボタン →「ホーム画面に追加」したアプリで開いてね" : "このブラウザは通知に対応してないはむ");
    }
    if ((await Notification.requestPermission()) !== "granted") throw new Error("通知がゆるされてないはむ。本体の設定で許可してね");
    await subscribePush(true);
    toast("通知オン🔔 お試し通知を送ったはむ");
  } catch (err) { toast(err.message); }
  showNotifyBanner();
}
function showNotifyBanner() {
  const supported = "PushManager" in window && "Notification" in window;
  const needsInstall = !supported && isIOS && !inApp;
  const canAsk = supported && Notification.permission === "default";
  $("notify-banner").hidden = store.get("notify-dismissed") === "1" || !(needsInstall || canAsk);
  $("notify-text").textContent = needsInstall
    ? "通知を受けとるには、共有ボタン →「ホーム画面に追加」して、そのアプリから開くはむ"
    : "通知をオンにすると、メッセージが来たときにスマホが鳴るはむ🔔";
  $("notify-on").hidden = needsInstall;
}
$("notify-btn").addEventListener("click", enableNotifications);
$("notify-on").addEventListener("click", enableNotifications);
$("notify-x").addEventListener("click", () => { store.set("notify-dismissed", "1"); showNotifyBanner(); });

boot().catch(() => { $("gate").hidden = false; $("gate-error").textContent = "つながらなかったはむ…もういちど開いてね"; });
</script>
