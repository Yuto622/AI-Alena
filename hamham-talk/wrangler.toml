name = "hamham-talk"
main = "src/worker.js"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
# スタンプ画像はログインしているふたりにだけ配る（Worker が先に受けて確認する）
run_worker_first = ["/stickers/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite 版 Durable Object（Cloudflare 無料プランで使える）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
